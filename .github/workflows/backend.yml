name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run poe format:check
      - name: Lint and check layer boundaries
        run: uv run poe lint
      - name: Type-check
        run: uv run poe typecheck
      - name: Test
        run: uv run poe test
      - name: Check production settings
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: api.example.com
        run: DJANGO_SECRET_KEY="$(openssl rand -hex 32)" uv run poe check:deploy

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: truck-routing-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Start the container and wait for /healthz
        run: |
          docker run --detach --name backend --publish 8000:8000 \
            --env DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            truck-routing-backend:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs backend
          exit 1
